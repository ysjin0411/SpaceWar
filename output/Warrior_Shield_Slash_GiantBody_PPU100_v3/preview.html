<!doctype html><html lang="ko"><meta charset="utf-8"><title>Warrior · GiantSword body · PPU100</title>
<style>*{box-sizing:border-box}body{background:#101821;color:#e8edf5;margin:0;padding:28px;font:15px system-ui}h1{margin:0 0 10px}p{color:#b8c6d8;line-height:1.8}main{display:grid;grid-template-columns:repeat(2,minmax(340px,1fr));gap:20px}article{background:#202c39;border:1px solid #3a4c60;border-radius:12px;padding:18px}.stage{position:relative;aspect-ratio:11/8;background-color:#28313b;background-image:conic-gradient(#303b46 25%,transparent 0 50%,#303b46 0 75%,transparent 0);background-size:24px 24px}.stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.overlay{display:none;opacity:.45}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}button{background:#ff9e33;color:#101821;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}input{accent-color:#ff9e33}input[type=range]{width:100%}.compare{width:100%;max-width:1650px;margin:12px 0}small{color:#aabbd0}@media(max-width:820px){main{grid-template-columns:1fr}}</style>
<h1>Warrior · GiantSword 몸체 기준</h1><p>PPU 100 · Max Size 2048 · Pivot Center (0.5, 0.5)<br>Idle / Run 각각 24프레임. 아래 비교 이미지는 같은 픽셀 배율입니다.</p>
<img class="compare" src="Preview/Compare_Idle.png" alt="같은 배율의 대기 자세 비교">
<img class="compare" src="Preview/Compare_Run.png" alt="같은 배율의 달리기 자세 비교"><main id="cards"></main>
<script>
for(const name of ['Shield_Idle','Shield_Run','Slash_Idle','Slash_Run']){
const run=name.endsWith('Run'),a=document.createElement('article');let frame=0,play=true,last=0,fps=run?40:12;
a.innerHTML='<h2>'+name+'</h2><div class="stage"><img class="anim"><img class="overlay" src="Preview/GiantSword_'+(run?'Run':'Idle')+'.png"></div><div class="controls"><button>일시정지</button><span class="counter"></span><label>FPS <input class="fps" type="number" value="'+fps+'" min="1" max="60" style="width:55px"></label><label><input class="toggle" type="checkbox"> 대검 몸체 겹쳐 보기</label></div><input class="seek" type="range" min="0" max="23"><small>투명 PNG 2048×2048 · PPU100 · Pivot(0.5,0.5)</small>';
document.getElementById('cards').append(a);const images=[];for(let i=1;i<=24;i++){const im=new Image();im.src='Preview/'+name+'/'+name+'_'+String(i).padStart(2,'0')+'.png';images.push(im);}
function show(){a.querySelector('.anim').src=images[frame].src;a.querySelector('.seek').value=frame;a.querySelector('.counter').textContent=(frame+1)+' / 24';}
a.querySelector('button').onclick=()=>{play=!play;a.querySelector('button').textContent=play?'일시정지':'재생';};
a.querySelector('.seek').oninput=e=>{frame=+e.target.value;play=false;a.querySelector('button').textContent='재생';show();};
a.querySelector('.fps').onchange=e=>fps=Math.max(1,Math.min(60,+e.target.value||12));
a.querySelector('.toggle').onchange=e=>a.querySelector('.overlay').style.display=e.target.checked?'block':'none';
function tick(t){if(play&&t-last>=1000/fps){frame=(frame+1)%24;last=t;show();}requestAnimationFrame(tick);}show();requestAnimationFrame(tick);
}</script></html>
