<!doctype html><html lang="ko"><meta charset="utf-8"><title>Boss Alien · Sprite Preview</title><style>
body{background:#171b25;color:#e7e9ef;font:16px system-ui;margin:32px}button,select{font:inherit;padding:8px;background:#30394b;color:white;border:1px solid #657188;border-radius:6px}section{display:flex;gap:16px;flex-wrap:wrap}figure{margin:0 0 24px}img{width:360px;height:360px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#394151 0% 25%,#252d3c 0% 50%) 50%/24px 24px}figcaption{padding:8px 0}h1{font-size:25px}.small{color:#abb7ca}a{color:#a4beff}</style>
<h1>Boss Alien · 개별 스프라이트 16개</h1><p>본체 1254×1254 · 투명 RGBA · 원본 여백 유지</p><p class="small">원본 대비 본체 외곽 최대 3px 차이. 체크 무늬는 이 미리보기의 배경입니다.</p>
<button id="play">일시정지</button> <label>프레임 <select id="frame"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<h2>동일 배율 비교</h2><section><figure><img src="Reference/Original_Body_Modular.png"><figcaption>기존 Body_Modular</figcaption></figure><figure><img id="Idle"><figcaption>새 Idle <span id="IdleLabel"></span></figcaption></figure><figure><img id="Hatch"><figcaption>소켓 개방 <span id="HatchLabel"></span></figcaption></figure></section>
<h2>독립 미사일 및 효과</h2><p class="small">이 아래는 확대 미리보기입니다. 게임 크기는 동봉한 Unity_Import_Settings.csv의 PPU를 적용하세요.</p><section><figure><img src="Missile_Body.png"><figcaption>미사일 본체</figcaption></figure><figure><img id="Exhaust"><figcaption>추진 불꽃</figcaption></figure><figure><img src="Missile_LaunchFlash.png"><figcaption>발사 섬광</figcaption></figure><figure><img id="Explosion"><figcaption>폭발</figcaption></figure></section><p><a href="README.md">사용 안내</a> · <a href="Unity_Import_Settings.csv">크기 설정</a></p><script>
const sets={"Idle": ["Idle_Modular_01.png", "Idle_Modular_02.png", "Idle_Modular_03.png", "Idle_Modular_04.png"], "Hatch": ["Hatch_Open_01.png", "Hatch_Open_02.png", "Hatch_Open_03.png", "Hatch_Open_04.png"], "Exhaust": ["Missile_Exhaust_01.png", "Missile_Exhaust_02.png"], "Explosion": ["Missile_Explosion_01.png", "Missile_Explosion_02.png", "Missile_Explosion_03.png", "Missile_Explosion_04.png"]};let i=0,playing=true;function draw(){for(const [k,v]of Object.entries(sets)){document.getElementById(k).src=v[i%v.length];const l=document.getElementById(k+'Label');if(l)l.textContent=(i%v.length)+1;}document.getElementById('frame').selectedIndex=i%4;}draw();setInterval(()=>{if(playing){i=(i+1)%4;draw();}},250);document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'일시정지':'재생';};document.getElementById('frame').onchange=function(){playing=false;i=this.selectedIndex;document.getElementById('play').textContent='재생';draw();};</script></html>
